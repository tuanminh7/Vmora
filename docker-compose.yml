services:
  postgres:
    image: postgres:16-alpine
    container_name: vmora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vmora
      POSTGRES_USER: vmora
      POSTGRES_PASSWORD: vmora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vmora_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
